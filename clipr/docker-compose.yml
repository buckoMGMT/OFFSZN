# Run the ClipR engine somewhere the web app can reach it.
#
#   cp .env.example .env      # set CLIPR_API_KEY
#   docker compose up -d
#   curl -H "Authorization: Bearer $CLIPR_API_KEY" localhost:8000/api/v1/health

services:
  engine:
    build: .
    image: clipr-engine:latest
    restart: unless-stopped
    ports:
      - "${CLIPR_PORT:-8000}:8000"
    environment:
      # Required. The web app sends this as `Authorization: Bearer <key>`.
      # With it unset the API is open to anyone who can reach the port.
      CLIPR_API_KEY: ${CLIPR_API_KEY:?set CLIPR_API_KEY in .env}
      # Lock this to the app's origin in production. The default of "*" is a
      # convenience for local development, not a setting to ship.
      CLIPR_CORS_ORIGINS: ${CLIPR_CORS_ORIGINS:-*}
      CLIPR_CONCURRENT_JOBS: ${CLIPR_CONCURRENT_JOBS:-1}
      CLIPR_MAX_UPLOAD_BYTES: ${CLIPR_MAX_UPLOAD_BYTES:-8589934592}
    volumes:
      # Customer media and job state. Losing this loses their clips.
      - clipr-data:/data
    # Video encoding will use everything it is given. Without a ceiling one
    # runaway job starves the host it shares.
    deploy:
      resources:
        limits:
          cpus: "${CLIPR_CPUS:-4}"
          memory: ${CLIPR_MEMORY:-8g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  clipr-data:
