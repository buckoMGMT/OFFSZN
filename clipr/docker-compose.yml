# Local stack.
#
# Two changes from the draft that matter:
#
#   * Migrations are no longer mounted into docker-entrypoint-initdb.d. That
#     directory only runs on an *empty* data volume, so once anyone has started
#     the stack, schema edits silently stop applying and the next developer
#     debugs a phantom. Migrations run explicitly via `make migrate`.
#   * The worker and api wait for a healthy database rather than a started one,
#     and both expose health endpoints so `depends_on` means something.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipr
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: clipr
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipr -d clipr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipr
      MINIO_ROOT_PASSWORD: dev_only_password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  worker:
    build: ./apps/pipeline
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  web:
    build: ./apps/web
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata: {}
  miniodata: {}
