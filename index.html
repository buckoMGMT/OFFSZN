<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Document-level background — kills white flashes during sheet transitions,
         video exits, and route changes before CSS loads -->
    <style>html { background-color: #0A0B0D; }</style>
    <link rel="manifest" href="/manifest.json" />
    <title>OFFSZN — High Performance System</title>
    <meta name="description" content="OFFSZN is the ultimate high-performance hub for athletes. Track macros, log workouts, and dominate your position." />
    <meta name="theme-color" content="#0A0B0D" />
    <meta property="og:title" content="OFFSZN" />
    <meta property="og:description" content="It's not the off-season. It's OFFSZN." />
    <meta property="og:image" content="https://media.base44.com/images/public/6a18d12ba29be5e91156d6b0/85cba95a6_generated_image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://media.base44.com/images/public/6a18d12ba29be5e91156d6b0/85cba95a6_generated_image.png" />
    <meta name="twitter:title" content="OFFSZN" />
    <meta name="twitter:description" content="It's not the off-season. It's OFFSZN." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo Black + Inter load from src/index.css — the only families the
         design system uses. Legacy families (Anton, Work Sans, Special Elite,
         Permanent Marker) removed: four downloads for zero rendered glyphs. -->
  </head>
  <body>
    <script>
      // App Store screenshot mode — only runs under automated capture (webdriver).
      // A 1284px-wide viewport zoomed 3× renders the exact 428×926 mobile layout
      // at native 1284×2778 pixel output. Never affects real users.
      if (navigator.webdriver && window.innerWidth >= 1200) {
        document.documentElement.style.zoom = 3;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
